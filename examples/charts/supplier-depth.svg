<text x="28.0" y="765.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Samples are excluded: only the 882 real products are counted, because a trial dataset is not a second source. Vendor COUNT is not</text>
