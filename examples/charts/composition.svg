<text x="198.0" y="526.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">The two largest vendors are opposites: Techsalerator's 246 listings are</text>
<text x="198.0" y="539.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">98% samples, John-Snow-Labs' 241 are 0%. Together they are 22% of the</text>
<text x="198.0" y="552.0" font-size="10.5" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">store.</text>
<line x1="28" y1="568.0" x2="852" y2="568.0" stroke="#e3e2db"/>
<text x="28.0" y="584.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Databricks Marketplace sitemap, first capture 2026-09-25. Vendor is the segment before the first underscore in the URL name;</text>
<text x="28.0" y="597.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">splitting on the hyphen instead shreds hyphenated vendors like john-snow-labs into useless tokens. The sample share is NOT a</text>
<text x="28.0" y="610.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">large-vendor habit: it is 57% among vendors with 20+ listings and 64% among smaller ones, so the split is store-wide rather than</text>
<text x="28.0" y="623.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">driven by the biggest sellers.</text>
