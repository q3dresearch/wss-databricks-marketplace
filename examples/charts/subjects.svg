<text x="28.0" y="616.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Databricks Marketplace sitemap, first capture 2026-09-25. SUBJECT IS INFERRED FROM THE PRODUCT NAME, because the publisher supplies</text>
<text x="28.0" y="629.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">no category anywhere -- not in the URL, not on the page. The rules are regular expressions applied first-match in a fixed order, so</text>
<text x="28.0" y="642.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">a listing naming two subjects lands in whichever comes first; both the patterns and that order are a judgement, and they are</text>
<text x="28.0" y="655.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">published in public/subjects-2026-09-25.json. 523 listings (24%) match no rule and are omitted from this chart.</text>
