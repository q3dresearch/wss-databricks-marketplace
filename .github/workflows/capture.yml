# One source, one sitemap, one job. The fleet's plan/shard/artifact dance exists
# to fan thousands of endpoints across runners; this fetches a single 653 KB file.
name: capture

on:
  schedule:
    - cron: "5 6 * * 4" # Thursday, off the hour -- GitHub's scheduler is contended at :00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-commits
  cancel-in-progress: false

env:
  WSS_CONTACT: ${{ secrets.WSS_CONTACT || format('{0} +https://github.com/{1}', github.repository_owner, github.repository) }}
  # MUST match the registry's `cadence:`. A mismatch makes `wss plan` return []
  # and the capture silently does nothing while the workflow stays green.
  CADENCE: weekly
  # v0.6.58 for the longest-match robots evaluator. apps.shopify.com blocks every
  # query string (Disallow: /*?*) while permitting /browse/ and the sitemaps, and
  # a first-match reader gets that wrong in one direction or the other.
  ENGINE_SPEC: "wss[object] @ git+https://github.com/${{ github.repository_owner }}/wss-engine.git@v0.6.58"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install "$ENGINE_SPEC"
      - name: Validate registry (hard gate)
        run: wss validate

      # Assign, never `echo "count=$(wss plan ...)"`: command substitution inside
      # echo yields echo's exit status, so a failing plan reports success.
      - name: Confirm the source is planned at this cadence
        id: plan
        run: |
          count=$(wss plan --cadence "$CADENCE" --shards 1 --count)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -lt 1 ]; then
            echo "plan returned $count at cadence $CADENCE -- refusing to report success" >&2
            exit 1
          fi

      # "1/1" -- the shard spec is ONE-BASED and needs both halves.
      - name: Capture
        run: wss capture --cadence "$CADENCE" --shard 1/1

      - name: Derive, schema, redraw
        run: |
          wss derive
          wss schema
          for c in examples/chart-*.py; do python "$c"; done

      - name: Drop quarantine (triage lives in CI artifacts, never in git)
        if: always()
        run: |
          if [ -d quarantine ]; then tar -czf quarantine.tgz quarantine && rm -rf quarantine; fi
      - name: Upload quarantine if anything was rejected
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quarantine-${{ github.run_id }}
          path: quarantine.tgz
          if-no-files-found: ignore
          retention-days: 90

      # Records what was attempted, not just that the cron fired.
      - name: Heartbeat
        run: |
          mkdir -p state
          printf '{"cadence":"%s","sources_planned":%s,"completed_at":"%s","event":"%s","run_id":"%s","workflow":"%s"}\n' \
            "$CADENCE" "${{ steps.plan.outputs.count }}" "$(date -u +%FT%TZ)" \
            "${{ github.event_name }}" "${{ github.run_id }}" "${{ github.workflow }}" \
            > state/last_run.json

      - name: Commit with rebase-retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A raw manifest registry state public examples/charts SCHEMA.md schema SOURCES.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "capture($CADENCE): run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $((i * 5))
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "rebase conflict on attempt $i -- not a push race" >&2
            fi
          done
          echo "push failed after 5 attempts" >&2
          exit 1
